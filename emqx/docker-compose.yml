version: "3.8"

services:
  emqx:
    image: emqx/emqx:5.7.1
    container_name: emqx
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "/init_emqx.sh"]
    volumes:
      - ./init_emqx.sh:/init_emqx.sh
      - ./certs:/opt/emqx/etc/certs
      - ./data:/opt/emqx/data
      - ./log:/opt/emqx/log
    ports:
      - "1883:1883"
      - "8883:8883"
      - "8083:8083"
      - "18083:18083"
    environment:
      # 기본값(admin/public)은 EMQX 공식 문서에 공개된 값이다. 반드시 .env 로 덮어쓴다.
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USER:?.env 파일에 EMQX_DASHBOARD_USER 를 설정하세요}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASS:?.env 파일에 EMQX_DASHBOARD_PASS 를 설정하세요}
      - EMQX_LOG__LEVEL=info
    networks:
      - chacha_net

networks:
  chacha_net:
    external: true
