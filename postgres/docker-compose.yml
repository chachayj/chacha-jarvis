version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: chacha-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: chacha
      POSTGRES_PASSWORD: chacha123
      POSTGRES_DB: chacha_db
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - chacha_net

networks:
  chacha_net:
    external: true
