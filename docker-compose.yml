version: "3.8"

services:
  # =====================================================
  # EMQX MQTT Broker
  # =====================================================
  emqx:
    extends:
      file: ./emqx/docker-compose.yml
      service: emqx

  # =====================================================
  # Fiber Server
  # =====================================================
  fiber-server:
    extends:
      file: ./backend/go_fiber_server/docker-compose.yml
      service: fiber-server

  # =====================================================
  # 📦 Focalboard DB (PostgreSQL)
  # =====================================================
  postgres:
    image: postgres:15
    container_name: plane_postgres
    restart: always
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
    volumes:
      - plane_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: plane_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    image: ghcr.io/makeplane/plane-backend:latest
    container_name: plane_backend
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://plane:plane@postgres:5432/plane
      REDIS_URL: redis://redis:6379
      SECRET_KEY: "changeme"
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: password
      DJANGO_SUPERUSER_USERNAME: admin
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py createsuperuser --noinput || true &&
        gunicorn plane.wsgi:application --bind 0.0.0.0:8000 --workers 4
      "
    restart: always

  worker:
    image: ghcr.io/makeplane/plane-worker:latest
    container_name: plane_worker
    depends_on:
      - backend
      - redis
    environment:
      DATABASE_URL: postgres://plane:plane@postgres:5432/plane
      REDIS_URL: redis://redis:6379
    restart: always

  frontend:
    image: ghcr.io/makeplane/plane-web:latest
    container_name: plane_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/
    restart: always

volumes:
  plane_pg_data:


networks:
  chacha_net:
    driver: bridge
