version: "3.8"

services:
  # =====================================================
  # EMQX MQTT Broker
  # =====================================================
  emqx:
    extends:
      file: ./emqx/docker-compose.yml
      service: emqx

  # =====================================================
  # Fiber Server
  # =====================================================
  fiber-server:
    extends:
      file: ./backend/go_fiber_server/docker-compose.yml
      service: fiber-server

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports: ["11434:11434"]
    volumes: [ "ollama:/root/.ollama" ]
    restart: unless-stopped

  voice-assistant:
    build:
      context: ./voice-assistant
    container_name: voice-assistant
    environment:
      - OLLAMA_URL=http://ollama:11434
      - TTS_VOICE_PATH=/app/models/ko-KR.onnx
      - TTS_VOICE_JSON=/app/models/ko-KR.onnx.json
      - TZ=Asia/Seoul
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE=int8
    ports: ["8080:8080"]
    volumes:
      - ./data/tts:/app/data/tts
      # 개발 편의로 로컬 수정 반영하려면 아래 주석 해제
      # - ./voice-assistant/static:/app/static:ro
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama:

networks:
  chacha_net:
    driver: bridge
