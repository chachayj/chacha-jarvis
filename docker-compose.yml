version: "3.8"

services:
  # =====================================================
  # EMQX MQTT Broker
  # =====================================================
  emqx:
    extends:
      file: ./emqx/docker-compose.yml
      service: emqx
    networks:
      - chacha_net

  # =====================================================
  # Fiber Server (Go)
  # =====================================================
  fiber-server:
    extends:
      file: ./backend/go_fiber_server/docker-compose.yml
      service: fiber-server
    networks:
      - chacha_net

  # =====================================================
  # Ollama (LLM Model)
  # =====================================================
  ollama:
    extends:
      file: ./ollama/docker-compose.yml
      service: ollama
    networks:
      - chacha_net

  # =====================================================
  # PostgreSQL (Safe Persistent DB)
  # =====================================================
  postgres:
    extends:
      file: ./postgres/docker-compose.yml
      service: postgres
    networks:
      - chacha_net

  # =====================================================
  # spring Server (Java 17)
  # =====================================================
  spring-server:
    extends:
      file: ./backend/spring_server/docker-compose.yml
      service: spring-server
    networks:
      - chacha_net

  # =====================================================
  # Voice Assistant (FastAPI + Whisper + TTS)
  # =====================================================
  voice-assistant:
    extends:
      file: ./voice-assistant/docker-compose.yml
      service: voice-assistant
    networks:
      - chacha_net

  # =====================================================
  # Vue3 + Cesium Frontend (Vite Dev Server)
  # =====================================================
  vue-frontend:
    extends:
      file: ./frontend/web/vue/docker-compose.yml
      service: vue-frontend
    networks:
      - chacha_net

  # =====================================================
  # Nginx HTTPS Proxy
  # =====================================================
  nginx:
    extends:
      file: ./nginx/docker-compose.yml
      service: nginx
    networks:
      - chacha_net

# =====================================================
# Shared Volumes & Network
# =====================================================
volumes:
  ollama:
  postgres-data:

networks:
  chacha_net:
    driver: bridge